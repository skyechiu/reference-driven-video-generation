<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 镜面水（activetheory 树场景的做法）</title>
<style>
  html,body{margin:0;height:100%;background:#050507;overflow:hidden;font:13px/1.5 system-ui,sans-serif;color:#cfd3da}
  #info{position:fixed;left:16px;top:14px;max-width:420px;pointer-events:none;text-shadow:0 1px 2px #000}
  #info b{color:#ff5fa2}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="info"><b>01 镜面水</b> —— 平面镜反射（Reflector）+ 一张法线图按 4 个尺度 / 方向 / 速度滚动叠加，用来抖动倒影的采样坐标。<br>拖动鼠标可以转动视角。</div>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ---------- 基础 ----------
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#050507');
scene.fog = new THREE.Fog('#050507', 12, 40);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 3.6, 12);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.6, -1);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;   // 不让镜头钻到水下

// ---------- 水面上方的东西（被倒映的对象）----------
const glow = new THREE.MeshBasicMaterial({ color: new THREE.Color('#ff2f7d').multiplyScalar(1.6) });
const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(1.1, 0.32, 200, 24), new THREE.MeshStandardMaterial({ color: '#2a0a18', emissive: '#ff2f7d', emissiveIntensity: 0.35, roughness: 0.35, metalness: 0.7 }));
knot.position.y = 2.4;
scene.add(knot);
for (let i = 0; i < 10; i++) {           // 一圈发光柱子
  const a = i / 10 * Math.PI * 2;
  const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 5, 8), glow);
  pillar.position.set(Math.cos(a) * 4.2, 2.5, Math.sin(a) * 4.2 - 1.5);
  scene.add(pillar);
}
scene.add(new THREE.HemisphereLight('#ff9ac6', '#050507', 0.25));
// 很暗的渐变天空：地平线处带一点紫红。水面会把它映出来，这样整片水都能看到波纹
const sky = new THREE.Mesh(new THREE.SphereGeometry(45, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `varying vec3 vP; void main(){ float h = normalize(vP).y;
    vec3 c = mix(vec3(0.16, 0.04, 0.10), vec3(0.01, 0.01, 0.015), smoothstep(0.0, 0.35, h));
    gl_FragColor = vec4(c, 1.0); }`,
}));
scene.add(sky);
const pl = new THREE.PointLight('#ff4f9a', 18, 20); pl.position.set(0, 4, 3); scene.add(pl);

// ---------- 第 1 步：现场生成一张"可平铺"的法线图 ----------
// 原站用的是一张现成的岩石法线图；这里用噪声算一张，效果同理，也不依赖外部文件。
function makeNormalMap(size = 256) {
  const h = new Float32Array(size * size);
  const rnd = (x, y, s) => { const n = Math.sin((x * 127.1 + y * 311.7 + s * 74.7)) * 43758.5453; return n - Math.floor(n); };
  for (let oct = 0, amp = 1, freq = 4; oct < 5; oct++, amp *= 0.5, freq *= 2) {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      const fx = x / size * freq, fy = y / size * freq;
      const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
      const w = (v) => ((v % freq) + freq) % freq;                   // 取模 = 可平铺
      const v00 = rnd(w(x0), w(y0), oct), v10 = rnd(w(x0 + 1), w(y0), oct);
      const v01 = rnd(w(x0), w(y0 + 1), oct), v11 = rnd(w(x0 + 1), w(y0 + 1), oct);
      const sx = tx * tx * (3 - 2 * tx), sy = ty * ty * (3 - 2 * ty);
      h[y * size + x] += amp * ((v00 * (1 - sx) + v10 * sx) * (1 - sy) + (v01 * (1 - sx) + v11 * sx) * sy);
    }
  }
  const data = new Uint8Array(size * size * 4);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const H = (xx, yy) => h[((yy + size) % size) * size + ((xx + size) % size)];
    const dx = (H(x + 1, y) - H(x - 1, y)) * 3.0, dy = (H(x, y + 1) - H(x, y - 1)) * 3.0;
    const n = new THREE.Vector3(-dx, -dy, 1).normalize();
    const i = (y * size + x) * 4;
    data[i] = (n.x * 0.5 + 0.5) * 255; data[i + 1] = (n.y * 0.5 + 0.5) * 255; data[i + 2] = (n.z * 0.5 + 0.5) * 255; data[i + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, size, size);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;       // 必须：可以无限滚动
  tex.minFilter = THREE.LinearMipmapLinearFilter; tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true; tex.needsUpdate = true;
  return tex;
}
const normalMap = makeNormalMap();

// ---------- 第 2 步：水的 shader（在 three.js 自带的 Reflector 上改）----------
const WaterShader = {
  name: 'MirrorWater',
  uniforms: {
    color: { value: null },
    tDiffuse: { value: null },          // Reflector 自动塞进来：镜像相机渲出的倒影
    textureMatrix: { value: null },     // Reflector 自动塞进来：把世界坐标投影到倒影图上
    tNormal: { value: normalMap },
    uTime: { value: 0 },
    uStrength: { value: 0.045 },         // 波纹扭曲倒影的强度
    uScale: { value: 0.35 },            // 波纹大小
    uSpeed: { value: 1.0 },
  },
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix;
    varying vec4 vMirrorCoord;
    varying vec3 vWorldPos;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      vMirrorCoord = textureMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * viewMatrix * wp;
    }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform sampler2D tNormal;
    uniform float uTime, uStrength, uScale, uSpeed;
    varying vec4 vMirrorCoord;
    varying vec3 vWorldPos;

    // 原站的 getWaterNoise：同一张法线图，4 个不同的尺度 / 方向 / 速度叠在一起，
    // 看不出重复，而且像水面一样"各处在往不同方向流"。
    vec3 waterNormal(vec2 p) {
      float t = uTime * 0.2 * uSpeed;
      vec2 uv0 = p * 1.00 + vec2( t / 17.0,  t / 29.0);
      vec2 uv1 = p * 0.97 - vec2(-t / 19.0,  t / 31.0);
      vec2 uv2 = p * 0.11 + vec2( t / 101.0, t / 97.0);
      vec2 uv3 = p * 0.10 - vec2( t / 109.0,-t / 113.0);
      vec3 n = texture2D(tNormal, uv0).rgb + texture2D(tNormal, uv1).rgb
             + texture2D(tNormal, uv2).rgb + texture2D(tNormal, uv3).rgb;
      n = n * 0.5 - 1.0;                         // 4 张 [0,1] 相加 → 映射到 [-1,1] 附近
      return normalize(vec3(n.x, 1.5, n.y));     // xz 平面上的法线（y 朝上）
    }

    void main() {
      vec3 N = waterNormal(vWorldPos.xz * uScale);
      vec2 uv = vMirrorCoord.xy / vMirrorCoord.w;    // 这个像素在倒影图上的位置
      uv += N.xz * uStrength;                         // ★ 核心：用法线去"推歪"倒影
      vec3 refl = texture2D(tDiffuse, uv).rgb;

      // 菲涅尔：越平视越像镜子，越往下看越暗（看到"水底"）
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - max(dot(V, N), 0.0), 3.0);
      vec3 deep = vec3(0.01, 0.005, 0.012);
      vec3 col = mix(deep + refl * 0.35, refl, clamp(0.25 + fres, 0.0, 1.0));

      // 一点高光碎片，让水面"闪"
      vec3 L = normalize(vec3(0.3, 1.0, -0.4));
      float spec = pow(max(dot(reflect(-L, N), V), 0.0), 120.0);
      col += spec * vec3(1.0, 0.6, 0.8) * 0.6;

      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
};

const water = new Reflector(new THREE.PlaneGeometry(60, 60), {
  shader: WaterShader,
  textureWidth: 1024 * Math.min(devicePixelRatio, 1.5),   // 原站：1024
  textureHeight: 1024 * Math.min(devicePixelRatio, 1.5),
  clipBias: 0.003,
});
water.rotation.x = -Math.PI / 2;
water.material.uniforms.tNormal.value = normalMap;   // Reflector 会克隆 uniforms，这里重新指一次
scene.add(water);

// ---------- 第 3 步：Bloom，让倒影里的亮部发光 ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.4, 0.75));
composer.addPass(new OutputPass());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  water.material.uniforms.uTime.value = t;
  knot.rotation.y = t * 0.3;
  knot.position.y = 2.4 + Math.sin(t * 0.8) * 0.15;
  controls.update();
  composer.render();
});
</script>
</body>
</html>
