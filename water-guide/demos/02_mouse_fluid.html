<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>02 鼠标流体扭曲（两个站都在用）</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font:13px/1.5 system-ui,sans-serif;color:#cfd3da}
  #info{position:fixed;left:16px;top:14px;max-width:460px;pointer-events:none;text-shadow:0 1px 2px #000}
  #info b{color:#d7ff00}
  kbd{border:1px solid #666;border-radius:3px;padding:0 4px}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="info"><b>02 鼠标流体</b> —— 256 宽的小网格上跑真正的流体（Stable Fluids），只把算出来的"速度图"拿来扭曲画面 + 色差 + 提亮。<br>用鼠标在画面上划。按 <kbd>D</kbd> 切换显示速度场本身。</div>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

// ================= 参数（和原站一个量级）=================
const P = {
  simRes: 256,          // alche: 256，activetheory: 256
  pressureIters: 8,     // alche: 4，activetheory: 5 —— 越多越"不可压缩"，越像水
  curl: 20,             // 涡度增强：越大越打旋
  velDissipation: 0.98, // 每帧速度保留比例（0.98~0.99），越大拖尾越长
  splatRadius: 0.0025,  // 鼠标"笔刷"大小
  splatForce: 5000,     // 鼠标推力
  distort: 0.00012,     // 最终画面被推歪的程度
  chroma: 0.00006,      // 色差强度（随流速变大）
  brighten: 0.0015,     // 流过的地方提亮
};

// ================= 工具：双缓冲 RenderTarget + 全屏 pass =================
let simW, simH;
function makeRT(filter = THREE.LinearFilter) {
  return new THREE.WebGLRenderTarget(simW, simH, {
    type: THREE.HalfFloatType, format: THREE.RGBAFormat,
    minFilter: filter, magFilter: filter, depthBuffer: false,
    wrapS: THREE.ClampToEdgeWrapping, wrapT: THREE.ClampToEdgeWrapping,
  });
}
class Double { constructor(f) { this.read = makeRT(f); this.write = makeRT(f); } swap() { [this.read, this.write] = [this.write, this.read]; } dispose() { this.read.dispose(); this.write.dispose(); } }

const quadScene = new THREE.Scene();
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
quadScene.add(quad);
function pass(material, target) {
  quad.material = material;
  renderer.setRenderTarget(target);
  renderer.render(quadScene, quadCam);
}

const baseVS = /* glsl */`
  uniform vec2 texel;
  varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    vUv = uv;
    vL = uv - vec2(texel.x, 0.0); vR = uv + vec2(texel.x, 0.0);
    vT = uv + vec2(0.0, texel.y); vB = uv - vec2(0.0, texel.y);
    gl_Position = vec4(position.xy, 0.0, 1.0);
  }`;
const mat = (fs, uniforms) => new THREE.ShaderMaterial({ vertexShader: baseVS, fragmentShader: fs, uniforms: { texel: { value: new THREE.Vector2() }, ...uniforms }, depthTest: false, depthWrite: false });

// ================= 流体的 7 个 pass =================
// ① splat：把鼠标这一帧的移动"注入"速度场（一个高斯斑）
const splatMat = mat(/* glsl */`
  uniform sampler2D uTarget; uniform vec2 uPoint; uniform vec2 uForce; uniform float uRadius, uAspect;
  varying vec2 vUv;
  void main() {
    vec2 p = vUv - uPoint; p.x *= uAspect;
    vec2 splat = exp(-dot(p, p) / uRadius) * uForce;
    gl_FragColor = vec4(texture2D(uTarget, vUv).xy + splat, 0.0, 1.0);
  }`, { uTarget: { value: null }, uPoint: { value: new THREE.Vector2() }, uForce: { value: new THREE.Vector2() }, uRadius: { value: 0 }, uAspect: { value: 1 } });

// ② curl：速度场的旋度（哪里在打转）
const curlMat = mat(/* glsl */`
  uniform sampler2D uVel; varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    float L = texture2D(uVel, vL).y, R = texture2D(uVel, vR).y;
    float T = texture2D(uVel, vT).x, B = texture2D(uVel, vB).x;
    gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
  }`, { uVel: { value: null } });

// ③ vorticity：把旋度"放大"回速度里 —— 这一步让流体有漩涡感（两个站都有）
const vortMat = mat(/* glsl */`
  uniform sampler2D uVel, uCurl; uniform float uCurlStrength, dt;
  varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    float L = texture2D(uCurl, vL).x, R = texture2D(uCurl, vR).x;
    float T = texture2D(uCurl, vT).x, B = texture2D(uCurl, vB).x, C = texture2D(uCurl, vUv).x;
    vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
    force /= length(force) + 1e-4;
    force *= uCurlStrength * C; force.y *= -1.0;
    gl_FragColor = vec4(texture2D(uVel, vUv).xy + force * dt, 0.0, 1.0);
  }`, { uVel: { value: null }, uCurl: { value: null }, uCurlStrength: { value: P.curl }, dt: { value: 0.016 } });

// ④ divergence：每个格子"流进"和"流出"差多少
const divMat = mat(/* glsl */`
  uniform sampler2D uVel; varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    float L = texture2D(uVel, vL).x, R = texture2D(uVel, vR).x;
    float T = texture2D(uVel, vT).y, B = texture2D(uVel, vB).y;
    vec2 C = texture2D(uVel, vUv).xy;
    if (vL.x < 0.0) L = -C.x; if (vR.x > 1.0) R = -C.x;   // 边界：墙
    if (vT.y > 1.0) T = -C.y; if (vB.y < 0.0) B = -C.y;
    gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
  }`, { uVel: { value: null } });

// ⑤ pressure：Jacobi 迭代求压力（迭代 N 次）
const presMat = mat(/* glsl */`
  uniform sampler2D uPressure, uDiv; varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    float L = texture2D(uPressure, vL).x, R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x, B = texture2D(uPressure, vB).x;
    gl_FragColor = vec4((L + R + B + T - texture2D(uDiv, vUv).x) * 0.25, 0.0, 0.0, 1.0);
  }`, { uPressure: { value: null }, uDiv: { value: null } });

// ⑥ gradient subtract：减去压力梯度 → 速度场变成"不可压缩"（这一步让它像水而不是烟）
const gradMat = mat(/* glsl */`
  uniform sampler2D uPressure, uVel; varying vec2 vUv, vL, vR, vT, vB;
  void main() {
    float L = texture2D(uPressure, vL).x, R = texture2D(uPressure, vR).x;
    float T = texture2D(uPressure, vT).x, B = texture2D(uPressure, vB).x;
    gl_FragColor = vec4(texture2D(uVel, vUv).xy - vec2(R - L, T - B), 0.0, 1.0);
  }`, { uPressure: { value: null }, uVel: { value: null } });

// ⑦ advection：速度场沿着自己流动（半拉格朗日），并慢慢衰减
const advMat = mat(/* glsl */`
  uniform sampler2D uVel, uSource; uniform float dt, uDissipation; uniform vec2 texel;
  varying vec2 vUv;
  void main() {
    vec2 coord = vUv - dt * texture2D(uVel, vUv).xy * texel;
    gl_FragColor = vec4(uDissipation * texture2D(uSource, coord).xy, 0.0, 1.0);
  }`, { uVel: { value: null }, uSource: { value: null }, dt: { value: 0.016 }, uDissipation: { value: P.velDissipation } });

// 清压力（每帧乘 0.8，activetheory 的做法；alche 直接清 0）
const clearMat = mat(/* glsl */`
  uniform sampler2D uTex; uniform float uValue; varying vec2 vUv;
  void main() { gl_FragColor = uValue * texture2D(uTex, vUv); }`, { uTex: { value: null }, uValue: { value: 0.8 } });

let vel, pres, divRT, curlRT;
function initSim() {
  const aspect = innerWidth / innerHeight;
  simW = aspect >= 1 ? P.simRes : Math.round(P.simRes * aspect);
  simH = aspect >= 1 ? Math.round(P.simRes / aspect) : P.simRes;
  [vel, pres].forEach(d => d && d.dispose()); [divRT, curlRT].forEach(r => r && r.dispose());
  vel = new Double(); pres = new Double(THREE.NearestFilter);
  divRT = makeRT(THREE.NearestFilter); curlRT = makeRT(THREE.NearestFilter);
  for (const m of [splatMat, curlMat, vortMat, divMat, presMat, gradMat, advMat, clearMat]) m.uniforms.texel.value.set(1 / simW, 1 / simH);
}
initSim();

// ================= 鼠标 =================
const pointer = { x: 0.5, y: 0.5, dx: 0, dy: 0, moved: false };
addEventListener('pointermove', (e) => {
  const x = e.clientX / innerWidth, y = 1 - e.clientY / innerHeight;
  pointer.dx += x - pointer.x; pointer.dy += y - pointer.y;
  pointer.x = x; pointer.y = y; pointer.moved = true;
});

function stepFluid(dt) {
  if (pointer.moved) {            // ① 注入
    splatMat.uniforms.uTarget.value = vel.read.texture;
    splatMat.uniforms.uPoint.value.set(pointer.x, pointer.y);
    splatMat.uniforms.uForce.value.set(pointer.dx * P.splatForce, pointer.dy * P.splatForce);
    splatMat.uniforms.uRadius.value = P.splatRadius;
    splatMat.uniforms.uAspect.value = innerWidth / innerHeight;
    pass(splatMat, vel.write); vel.swap();
    pointer.dx = pointer.dy = 0; pointer.moved = false;
  }
  curlMat.uniforms.uVel.value = vel.read.texture; pass(curlMat, curlRT);                                  // ②
  vortMat.uniforms.uVel.value = vel.read.texture; vortMat.uniforms.uCurl.value = curlRT.texture;
  vortMat.uniforms.dt.value = dt; pass(vortMat, vel.write); vel.swap();                                   // ③
  divMat.uniforms.uVel.value = vel.read.texture; pass(divMat, divRT);                                     // ④
  clearMat.uniforms.uTex.value = pres.read.texture; pass(clearMat, pres.write); pres.swap();
  presMat.uniforms.uDiv.value = divRT.texture;
  for (let i = 0; i < P.pressureIters; i++) { presMat.uniforms.uPressure.value = pres.read.texture; pass(presMat, pres.write); pres.swap(); } // ⑤
  gradMat.uniforms.uPressure.value = pres.read.texture; gradMat.uniforms.uVel.value = vel.read.texture;
  pass(gradMat, vel.write); vel.swap();                                                                   // ⑥
  advMat.uniforms.uVel.value = vel.read.texture; advMat.uniforms.uSource.value = vel.read.texture;
  advMat.uniforms.dt.value = dt; pass(advMat, vel.write); vel.swap();                                     // ⑦
}

// ================= 被扭曲的"画面"（换成你自己的 3D 场景 RT 即可）=================
function makeBackdrop() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 1152;
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(1024, 600, 50, 1024, 600, 1200);
  grd.addColorStop(0, '#1b2a44'); grd.addColorStop(1, '#030407');
  g.fillStyle = grd; g.fillRect(0, 0, c.width, c.height);
  g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = 2;
  for (let x = 0; x <= c.width; x += 64) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, c.height); g.stroke(); }
  for (let y = 0; y <= c.height; y += 64) { g.beginPath(); g.moveTo(0, y); g.lineTo(c.width, y); g.stroke(); }
  g.fillStyle = '#ffffff'; g.font = '700 300px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('WATER', 1024, 520);
  g.fillStyle = '#d7ff00'; g.font = '500 56px ui-monospace, monospace';
  g.fillText('DRAG YOUR MOUSE', 1024, 800);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearFilter;
  return t;
}
const backdrop = makeBackdrop();

// ================= 最终合成：用速度图扭曲画面 =================
const finalMat = new THREE.ShaderMaterial({
  uniforms: { tScene: { value: backdrop }, tVel: { value: null }, uDistort: { value: P.distort }, uChroma: { value: P.chroma }, uBright: { value: P.brighten }, uDebug: { value: 0 }, uAspect: { value: 1 }, uImgAspect: { value: 2048 / 1152 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tScene, tVel; uniform float uDistort, uChroma, uBright, uDebug, uAspect, uImgAspect;
    varying vec2 vUv;
    vec2 cover(vec2 uv) {             // 背景图按 cover 方式铺满
      vec2 s = uAspect > uImgAspect ? vec2(1.0, uImgAspect / uAspect) : vec2(uAspect / uImgAspect, 1.0);
      return (uv - 0.5) * s + 0.5;
    }
    void main() {
      vec2 v = texture2D(tVel, vUv).xy;        // 这一格的流速
      float s = length(v);
      vec2 uv = vUv - v * uDistort;            // ★ 1. 顺着流动方向把画面推歪
      vec2 off = normalize(v + 1e-5) * s * uChroma;
      vec3 col;                                // ★ 2. 色差：R/G/B 各推不同距离
      col.r = texture2D(tScene, cover(uv + off)).r;
      col.g = texture2D(tScene, cover(uv)).g;
      col.b = texture2D(tScene, cover(uv - off)).b;
      col *= 1.0 + s * uBright;                // ★ 3. 流过的地方提亮
      if (uDebug > 0.5) col = vec3(abs(v) * 0.004, s * 0.002);   // 调试：直接看速度场
      gl_FragColor = vec4(col, 1.0);
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false,
});

addEventListener('keydown', (e) => { if (e.key === 'd' || e.key === 'D') finalMat.uniforms.uDebug.value = 1 - finalMat.uniforms.uDebug.value; });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); initSim(); });

let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  stepFluid(dt);
  finalMat.uniforms.tVel.value = vel.read.texture;
  finalMat.uniforms.uAspect.value = innerWidth / innerHeight;
  pass(finalMat, null);
});
</script>
</body>
</html>
