<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
  <title id="title">Detailed Pipeline — Evaluation &amp; Repair Loop</title>
  <desc id="desc">Web-ready diagram showing two input modes, analysis and prompt construction, package selection, and a shared evaluation and repair loop.</desc>
  <defs>
    <style>
      .page{fill:#f7f7f5}.panel{fill:#fff;stroke:#deded9;stroke-width:1.2}.section{fill:#fff;stroke:#e2e2dd;stroke-width:1.2}
      .purple{fill:#f0f0ff;stroke:#aaaaff}.green{fill:#edf9f5;stroke:#99e2c9}.orange{fill:#fff8ec;stroke:#f1cb83}.red{fill:#fff1f1;stroke:#f2abab}.blue{fill:#eef8ff;stroke:#a9dfff}
      .dash-purple{fill:#fff;stroke:#c9c9ff;stroke-width:1.5;stroke-dasharray:7 6}
      text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#111827}.title{font-size:24px;font-weight:750}.kicker{font-size:11px;font-weight:800;letter-spacing:1.4px}.h{font-size:15px;font-weight:750}.body{font-size:12px;fill:#4b5563}.small{font-size:10.5px;fill:#7b8491}.tiny{font-size:9.5px;fill:#8b93a1}.p{fill:#5b5bf7}.g{fill:#009b62}.o{fill:#bf6a00}.r{fill:#d92d2d}.b{fill:#1662c6}.muted{fill:#7d8590}
      .line{fill:none;stroke:#8c939d;stroke-width:1.5}.line-dash{fill:none;stroke:#9ca3af;stroke-width:1.5;stroke-dasharray:5 5}.line-p{fill:none;stroke:#5b5bf7;stroke-width:2}.line-g{fill:none;stroke:#00a36b;stroke-width:2}.line-o{fill:none;stroke:#c56b00;stroke-width:1.7;stroke-dasharray:5 4}.line-r{fill:none;stroke:#e03b3b;stroke-width:1.8}.card{rx:12;ry:12;stroke-width:1.4}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#8c939d"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5b5bf7"/></marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#00a36b"/></marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#c56b00"/></marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#e03b3b"/></marker>
  </defs>

  <rect class="page" width="1440" height="1080"/>
  <rect class="panel" x="28" y="28" width="1384" height="1024" rx="16"/>
  <text class="title" x="64" y="73">Detailed Pipeline — Evaluation &amp; Repair Loop</text>
  <text class="body" x="64" y="96">Reference-guided generation, package conditioning, multi-metric evaluation and targeted auto-repair</text>

  <!-- INPUTS -->
  <text class="kicker muted" x="64" y="137">01 · INPUT ROUTING</text>
  <rect class="purple card" x="64" y="154" width="616" height="84"/>
  <text class="kicker p" x="372" y="177" text-anchor="middle">INPUT MODE A</text>
  <text class="h" x="372" y="199" text-anchor="middle">Reference Video</text>
  <text class="body" x="372" y="219" text-anchor="middle">upload reference video · confirm copyright · select strategy</text>
  <rect class="green card" x="760" y="154" width="616" height="84"/>
  <text class="kicker g" x="1068" y="177" text-anchor="middle">INPUT MODE B</text>
  <text class="h" x="1068" y="199" text-anchor="middle">Storyboard Prompt</text>
  <text class="body" x="1068" y="219" text-anchor="middle">character card → story prompt → storyboard sheet → panel review</text>
  <rect x="704" y="178" width="32" height="28" rx="14" fill="#fff" stroke="#d7d7d2"/>
  <text class="small" x="720" y="197" text-anchor="middle" font-weight="800">OR</text>

  <!-- STRATEGIES -->
  <path class="line-p" d="M372 238V257" marker-end="url(#arrP)"/>
  <rect class="green card" x="64" y="270" width="188" height="72"/>
  <text class="kicker g" x="158" y="292" text-anchor="middle">STRATEGY A</text><text class="h" x="158" y="314" text-anchor="middle">Multi-shot</text><text class="small" x="158" y="332" text-anchor="middle">PySceneDetect</text>
  <rect class="purple card" x="268" y="270" width="208" height="72"/>
  <text class="kicker p" x="372" y="292" text-anchor="middle">STRATEGY B</text><text class="h" x="372" y="314" text-anchor="middle">Single-take</text><text class="small" x="372" y="332" text-anchor="middle">Continuity check</text>
  <rect class="orange card" x="492" y="270" width="188" height="72" stroke-dasharray="6 4"/>
  <text class="kicker o" x="586" y="292" text-anchor="middle">STRATEGY C</text><text class="h" x="586" y="314" text-anchor="middle">Dance / Driving</text><text class="small o" x="586" y="332" text-anchor="middle">Future work</text>

  <!-- ANALYSIS -->
  <path class="line" d="M158 342V365H372"/><path class="line" d="M372 342V365"/><path class="line" d="M586 342V365H372" marker-end="url(#arr)"/>
  <path class="line-dash" d="M1068 238V365H696" marker-end="url(#arr)"/>
  <text class="kicker muted" x="64" y="388">02 · ANALYSIS &amp; CONDITIONING</text>
  <rect class="section card" x="64" y="402" width="616" height="100"/>
  <text class="kicker" x="372" y="427" text-anchor="middle">STRUCTURAL ANALYSIS</text>
  <text class="body" x="372" y="452" text-anchor="middle">PySceneDetect   ·   MediaPipe / DWPose   ·   librosa (BPM)</text>
  <text class="small" x="372" y="477" text-anchor="middle">shot cuts · framing · pose keypoints · beat timestamps · motion profile</text>
  <rect class="purple card" x="64" y="518" width="616" height="84"/>
  <text class="kicker p" x="372" y="543" text-anchor="middle">SEMANTIC ENRICHMENT — GPT-4o VISION</text>
  <text class="body" x="372" y="567" text-anchor="middle">action · expression · emotion · camera · lighting · prompt_fragment</text>
  <text class="small" x="372" y="588" text-anchor="middle">per-shot / per-key-moment · risk flags · VLM enrichment written to storyboard JSON</text>
  <path class="line-p" d="M372 502V518" marker-end="url(#arrP)"/>

  <!-- PACKAGE -->
  <rect class="section card" x="716" y="402" width="660" height="200"/>
  <text class="kicker" x="1046" y="428" text-anchor="middle">PACKAGE SELECTION</text>
  <text class="small" x="1046" y="447" text-anchor="middle">Reusable conditioning sources are selected independently</text>
  <rect class="red card" x="740" y="466" width="196" height="108"/>
  <text class="kicker r" x="838" y="491" text-anchor="middle">IDENTITY</text>
  <text class="body" x="838" y="516" text-anchor="middle">face · bone structure</text><text class="body" x="838" y="535" text-anchor="middle">body proportions · age / skin tone</text><text class="small" x="838" y="559" text-anchor="middle">ArcFace refs.</text>
  <rect class="orange card" x="948" y="466" width="196" height="108"/>
  <text class="kicker o" x="1046" y="491" text-anchor="middle">LOOK</text>
  <text class="body" x="1046" y="516" text-anchor="middle">hair · makeup · outfit</text><text class="body" x="1046" y="535" text-anchor="middle">shoes · accessories · texture</text><text class="small" x="1046" y="559" text-anchor="middle">LoRA + ref. images</text>
  <rect class="blue card" x="1156" y="466" width="196" height="108"/>
  <text class="kicker b" x="1254" y="491" text-anchor="middle">SCENE</text>
  <text class="body" x="1254" y="516" text-anchor="middle">environment · light</text><text class="body" x="1254" y="535" text-anchor="middle">background · floor · mood</text><text class="small" x="1254" y="559" text-anchor="middle">scene_package.json</text>

  <!-- BUILDERS -->
  <rect class="section card" x="64" y="618" width="616" height="68"/>
  <text class="kicker" x="372" y="643" text-anchor="middle">TEMPLATE BUILDER</text><text class="h" x="372" y="665" text-anchor="middle">Beat-aligned Storyboard JSON</text><text class="tiny" x="372" y="681" text-anchor="middle">shot cuts snapped to beats (≤150ms) · generation_units[] normalised</text>
  <path class="line-p" d="M372 602V618" marker-end="url(#arrP)"/>
  <path class="line-dash" d="M680 652H706V602H716" marker-end="url(#arr)"/>
  <rect class="section card" x="716" y="618" width="660" height="68"/>
  <text class="kicker" x="1046" y="643" text-anchor="middle">PROMPT BUILDER</text><text class="h" x="1046" y="665" text-anchor="middle">keyframe_prompt · video_prompt · negative_prompt</text><text class="tiny" x="1046" y="681" text-anchor="middle">structure + identity + look + scene + constraints · auto-assembled per unit</text>
  <path class="line-dash" d="M1046 602V618" marker-end="url(#arr)"/>

  <!-- SHARED LOOP -->
  <rect class="dash-purple" x="64" y="718" width="1312" height="242" rx="14"/>
  <rect x="82" y="707" width="170" height="22" fill="#fff"/>
  <text class="kicker p" x="88" y="723">03 · SHARED CORE LOOP</text>
  <text class="small" x="1348" y="724" text-anchor="end">per generation_unit</text>
  <path class="line-p" d="M1046 686V705H298V742" marker-end="url(#arrP)"/>

  <rect class="purple card" x="104" y="742" width="388" height="58"/>
  <text class="kicker p" x="298" y="763" text-anchor="middle">GENERATE KEYFRAME</text><text class="h" x="298" y="785" text-anchor="middle">GPT-image-1 + LoRA + pose ref</text><text class="tiny" x="298" y="797" text-anchor="middle">IP-Adapter · identity + look + scene + framing</text>
  <path class="line-p" d="M298 800V818" marker-end="url(#arrP)"/>
  <rect class="purple card" x="104" y="820" width="388" height="58"/>
  <text class="kicker p" x="298" y="842" text-anchor="middle">IMAGE-TO-VIDEO</text><text class="h" x="298" y="864" text-anchor="middle">Kling I2V API</text><text class="tiny" x="298" y="875" text-anchor="middle">keyframe → short video clip</text>
  <path class="line-p" d="M492 849H532" marker-end="url(#arrP)"/>
  <rect class="section card" x="534" y="820" width="262" height="58"/>
  <text class="kicker" x="665" y="842" text-anchor="middle">EVALUATE</text><text class="h" x="665" y="864" text-anchor="middle">Multi-metric scoring</text><text class="tiny" x="665" y="875" text-anchor="middle">identity · look · scene · pose · framing · beat</text>

  <path class="line-g" d="M796 836H844" marker-end="url(#arrG)"/><text class="kicker g" x="820" y="827" text-anchor="middle">PASS</text>
  <rect class="green card" x="846" y="802" width="220" height="76"/>
  <text class="kicker g" x="956" y="826" text-anchor="middle">DECISION LOG</text><text class="body" x="956" y="850" text-anchor="middle">verdict: pass</text><text class="small" x="956" y="869" text-anchor="middle">scores · attempt logged</text>
  <path class="line-g" d="M1066 840H1114" marker-end="url(#arrG)"/>
  <rect class="green card" x="1116" y="802" width="224" height="76"/>
  <text class="kicker g" x="1228" y="826" text-anchor="middle">NEXT UNIT</text><text class="body" x="1228" y="850" text-anchor="middle">→ assembly queue</text>

  <path class="line-r" d="M665 878V897" marker-end="url(#arrR)"/><text class="kicker r" x="682" y="894">FAIL</text>
  <rect class="orange card" x="534" y="900" width="262" height="42"/>
  <text class="kicker o" x="665" y="919" text-anchor="middle">REPAIR PLANNER</text><text class="small" x="665" y="936" text-anchor="middle">diagnose → targeted fix</text>
  <path class="line-o" d="M534 922H78V771H104" marker-end="url(#arrO)"/>
  <text class="kicker o" x="89" y="862" transform="rotate(-90 89 862)" text-anchor="middle">RETRY (MAX N)</text>
  <path class="line-o" d="M796 922H844" marker-end="url(#arrO)"/>
  <rect class="orange card" x="846" y="900" width="220" height="42"/>
  <text class="kicker o" x="956" y="919" text-anchor="middle">DECISION LOG · FAIL</text><text class="tiny" x="956" y="936" text-anchor="middle">diagnosis · repair action</text>
  <path class="line-r" d="M1066 922H1114" marker-end="url(#arrR)"/>
  <rect class="red card" x="1116" y="900" width="224" height="42"/>
  <text class="kicker r" x="1228" y="919" text-anchor="middle">TERMINAL · HUMAN REVIEW</text><text class="tiny" x="1228" y="936" text-anchor="middle">max retries reached</text>

  <!-- FOOTER -->
  <rect class="green card" x="64" y="986" width="616" height="44"/>
  <text class="kicker g" x="84" y="1005">FINAL ASSEMBLY</text><text class="body" x="84" y="1022">Passed units in beat order → final 9:16 video + evaluation report from decision-log data.</text>
  <rect class="purple card" x="716" y="986" width="660" height="44"/>
  <text class="kicker p" x="736" y="1005">CORE EXPERIMENT</text><text class="body" x="736" y="1022">Loop OFF baseline vs Loop ON auto-repair → consistency, failures, interventions and repair success.</text>
</svg>
